# Throwaway PostgreSQL for the API-level integration tests in `tests/`.
#
# Matches the `DATABASE_URL` in `.env` (postgres:postgres@localhost:5432/iokeepv2).
#
#   docker compose -f docker-compose.test.yml up -d
#   npx prisma db push                    # create the schema (no migrations yet)
#   npm run test:api
#
# Tear down with:
#   docker compose -f docker-compose.test.yml down

services:
  db:
    image: postgres:16
    container_name: iokeep-test-db
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iokeepv2
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iokeepv2"]
      interval: 2s
      timeout: 5s
      retries: 15
